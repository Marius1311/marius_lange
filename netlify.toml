[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  # The Noble build image ships no default Hugo, so this is mandatory.
  # Blowfish requires >= 0.158.0 extended.
  HUGO_VERSION = "0.164.0"
  GO_VERSION = "1.23"
  # Persists the downloaded Hugo module between builds. Hugo infers this on
  # Netlify anyway, but only when NETLIFY, PULL_REQUEST and DEPLOY_PRIME_URL
  # are all set — setting it explicitly removes the guesswork.
  HUGO_CACHEDIR = "/opt/build/cache/hugo_cache"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# The Talks section was retired; keep old /event/ links from 404ing.
# Content is still in git history if it ever needs to come back.
[[redirects]]
  from = "/event/*"
  to = "/post/"
  status = 301

# The /about/ page was folded into the homepage. Two rules because the splat
# does not reliably cover the bare /about.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301

